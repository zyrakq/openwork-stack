[paths]
environments_path = "./environments"
extensions_dirs = ["extensions"]

[build]
skip_base_generation = true
# rust yaml merger — the host has no yq binary (and host package managers are off-limits)
yaml_merger = "rust"
copy_additional_files = true
env_file_patterns = [".env"]
extensions = ["model-keys", "repo-sync", "repo-local", "step-ca-trust", "review"]

[build.combos]
entire = ["model-keys", "repo-sync"]
entire-trust = ["model-keys", "repo-sync", "step-ca-trust"]
entire-review = ["model-keys", "repo-sync", "review"]

[build.environments]
available = ["forwarding", "letsencrypt", "step-ca", "forwarding-review"]

[build.environments.forwarding]
extensions = []
combos = ["entire"]

[build.environments.forwarding-review]
extensions = []
combos = ["entire-review"]

[build.environments.letsencrypt]
extensions = []
combos = ["entire"]

[build.environments.step-ca]
extensions = []
combos = ["entire-trust"]
